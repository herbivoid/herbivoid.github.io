    summon me for divination sessions, shows, party quests, exorcisms <br>

    other stuff better not put in writing but if you know you know

    <form class="summon-form" action="https://formsubmit.co/herbivoid@proton.me" method="POST">

      <label for="email">email</label>
      <input type="email" id="email" name="email" required>
      <label for="message">message</label>
      <textarea id="message" name="message" rows="6" required></textarea>
      <button type="submit">Summon &#x2661;</button>
    </form>
